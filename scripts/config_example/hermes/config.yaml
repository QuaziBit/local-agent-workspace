web:
  backend: "ddgs"

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

# ── Ollama Endpoint Options (reference) ─────────────────────────────
# Switching targets requires editing BOTH model.base_url AND
# custom_providers[0].base_url, plus model.default AND
# custom_providers[0].model to match a model actually pulled on
# that target — laptop and desktop have separate model libraries
# (check with: docker compose ... exec ollama ollama list).
#
# NOTE: editing values here, inside model:/custom_providers:, only
# lasts until the next time the desktop app's model picker is used —
# that UI rewrites this block directly. This reference section is
# safe from that since it's outside the block it manages.
#
# Laptop, local WSL container:
#   base_url: http://ollama:11434/v1
#   models available: gemma4:e2b (100% GPU, ~4s/turn on 6GB card)
#
# Desktop, over the LAN (current):
#   base_url: http://<IPv4>:11434/v1
#   models available: gemma4:e4b (fits fully in 8GB VRAM)
#   requires: desktop Ollama app running, OLLAMA_HOST=0.0.0.0 set,
#   Windows Firewall Block rules removed, Portmaster's Force Block
#   Incoming Connections overridden for ollama.exe — see
#   local-models.md "LAN Ollama" for the full debugging story.
#   IP is DHCP-assigned, not reserved — verify with ipconfig on the
#   desktop if this stops working after a desktop reboot.
#
# Hotspot workaround (retired, kept for reference only):
#   base_url: http://192.168.137.1:11434/v1
#   Was the diagnostic path that found the real bugs above — not
#   needed now that the real firewall/Portmaster issues are fixed.